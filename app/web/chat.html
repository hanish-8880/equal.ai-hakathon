<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0b7a5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chinku">
<title>Chinku</title>
<style>
  :root {
    --bg:#f3f1ec; --surface:#ffffff; --surface2:#f7f6f2; --ink:#14181b; --mut:#6b737a; --line:#e6e3dc;
    --acc:#0b7a5c; --acc2:#0e9a74; --acc-ink:#ffffff; --me:#dcf5e6; --me-ink:#0f2a1e;
    --ok:#1b7a4a; --ok-bg:#e3f4ea; --warn:#8a5a00; --warn-bg:#fdf1dc; --bad:#b3261e; --bad-bg:#fde7e5; --grey:#596168; --grey-bg:#eceae5;
    --hl:#ffe08a; --shadow:0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
    --r:18px; --ease:cubic-bezier(.2,.8,.2,1);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#0c1114; --surface:#151c20; --surface2:#1b2327; --ink:#e8eef0; --mut:#90a0a8; --line:#253035;
    --acc:#12a37b; --acc2:#16c08f; --acc-ink:#04140e; --me:#12392c; --me-ink:#d9f3e7;
    --ok:#5fd39a; --ok-bg:#123024; --warn:#f2bd5c; --warn-bg:#33270f; --bad:#ff8a80; --bad-bg:#3a1714; --grey:#a7b3b9; --grey-bg:#222b30;
    --hl:#6b5714; --shadow:none; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { margin:0; display:flex; flex-direction:column; height:100dvh; background:var(--bg); color:var(--ink);
         font:15.5px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Telugu", sans-serif; overscroll-behavior:none; }
  button { font:inherit; color:inherit; }

  /* header */
  header { display:flex; align-items:center; gap:10px; padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
           background:var(--surface); border-bottom:1px solid var(--line); position:relative; z-index:2; }
  .avatar { width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,var(--acc),var(--acc2)); color:#fff;
            display:grid; place-items:center; font-weight:700; font-size:17px; flex:none; }
  .who { min-width:0; flex:1; }
  .who b { display:block; font-size:16.5px; line-height:1.2; }
  #status { font-size:12.5px; color:var(--mut); display:flex; align-items:center; gap:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #status .dot { width:7px; height:7px; border-radius:50%; background:var(--ok); flex:none; }
  #status.busy .dot { background:var(--warn); animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  .iconbtn { width:38px; height:38px; border-radius:50%; border:0; background:transparent; display:grid; place-items:center; cursor:pointer; flex:none; color:var(--mut); }
  .iconbtn:active { background:var(--surface2); }
  .iconbtn[aria-pressed="true"] { color:var(--acc); }
  #jobchip { border:1px solid var(--line); background:var(--surface2); border-radius:999px; padding:6px 12px; max-width:44vw; cursor:pointer;
             font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* chat */
  #log { flex:1; overflow-y:auto; padding:14px 12px 8px; display:flex; flex-direction:column; gap:4px; scroll-behavior:smooth; }
  .row { display:flex; animation:pop .28s var(--ease) both; }
  .row.me { justify-content:flex-end; } .row.me + .row.bot, .row.bot + .row.me { margin-top:8px; }
  @keyframes pop { from { opacity:0; transform:translateY(8px) scale(.98); } to { opacity:1; transform:none; } }
  .bubble { max-width:min(84%,560px); padding:9px 12px 8px; border-radius:var(--r); white-space:pre-wrap; overflow-wrap:anywhere; box-shadow:var(--shadow); }
  .me .bubble { background:var(--me); color:var(--me-ink); border-bottom-right-radius:6px; }
  .bot .bubble { background:var(--surface); border-bottom-left-radius:6px; }
  .meta { display:block; text-align:right; font-size:10.5px; color:var(--mut); margin-top:3px; }
  .pending .meta::after { content:" · sending"; }
  .readback { font-weight:600; }
  .heard { background:var(--surface2) !important; color:var(--ink) !important; border:1px dashed var(--line); box-shadow:none; }
  .heard .lbl { display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--mut); margin-bottom:3px; font-weight:600; }
  .heard .lbl a { color:var(--acc); text-decoration:none; font-weight:600; }
  .hl { background:var(--hl); border-radius:4px; padding:0 3px; cursor:pointer; box-decoration-break:clone; -webkit-box-decoration-break:clone; }
  .hl.low { background:var(--bad-bg); outline:1px solid var(--bad); }
  .bubble img { max-width:100%; border-radius:12px; display:block; margin-top:6px; }
  .bubble audio { width:100%; margin-top:6px; height:36px; }
  .file { display:inline-flex; align-items:center; gap:6px; margin-top:6px; padding:8px 12px; border-radius:12px; background:var(--surface2);
          color:var(--acc); text-decoration:none; font-weight:600; }

  /* cards + chips */
  .card { margin-top:8px; background:var(--surface2); border:1px solid var(--line); border-radius:14px; padding:10px 12px; white-space:normal; }
  .card .top { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
  .card .jid { font-weight:700; } .card .title { font-weight:600; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:3px 12px; font-size:13.5px; }
  .kv dt { color:var(--mut); } .kv dd { margin:0; }
  .next { margin-top:8px; padding:8px 10px; border-radius:10px; background:var(--surface); font-size:13.5px; display:flex; gap:8px; align-items:flex-start; }
  .chip { display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:999px; letter-spacing:.1px; }
  .chip.ok { color:var(--ok); background:var(--ok-bg); } .chip.warn { color:var(--warn); background:var(--warn-bg); }
  .chip.bad { color:var(--bad); background:var(--bad-bg); } .chip.grey { color:var(--grey); background:var(--grey-bg); }
  .chip.sim { background:transparent; border:1px dashed currentColor; }

  /* typing */
  .typing .bubble { display:flex; align-items:center; gap:8px; color:var(--mut); font-size:13.5px; }
  .dots { display:inline-flex; gap:3px; } .dots i { width:6px; height:6px; border-radius:50%; background:var(--mut); animation:bounce 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay:.15s; } .dots i:nth-child(3) { animation-delay:.3s; }
  @keyframes bounce { 0%,60%,100% { transform:translateY(0); opacity:.5; } 30% { transform:translateY(-4px); opacity:1; } }

  /* welcome */
  .welcome { margin:auto 4px; text-align:center; padding:20px 8px; animation:pop .4s var(--ease) both; }
  .welcome .big { width:64px; height:64px; margin:0 auto 10px; font-size:28px; }
  .welcome h2 { margin:4px 0; font-size:20px; } .welcome p { margin:0 0 14px; color:var(--mut); }
  .examples { display:flex; flex-direction:column; gap:8px; max-width:440px; margin:0 auto; }
  .examples button { text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:14px; padding:10px 12px; cursor:pointer; box-shadow:var(--shadow); }
  .examples button span { display:block; font-size:12px; color:var(--mut); }

  /* quick replies */
  #quick { display:flex; gap:8px; padding:0 12px 8px; overflow-x:auto; scrollbar-width:none; }
  #quick:empty { display:none; }
  #quick button { flex:none; border:1px solid var(--acc); color:var(--acc); background:var(--surface); border-radius:999px; padding:7px 14px;
                  font-weight:600; font-size:13.5px; cursor:pointer; animation:pop .25s var(--ease) both; }
  #quick button.primary { background:var(--acc); color:var(--acc-ink); }

  /* composer */
  footer { background:var(--surface); border-top:1px solid var(--line); padding:8px 10px calc(8px + env(safe-area-inset-bottom)); position:relative; }
  .composer { display:flex; align-items:flex-end; gap:8px; }
  .field { flex:1; display:flex; align-items:flex-end; background:var(--surface2); border:1px solid var(--line); border-radius:24px; padding:4px 6px 4px 4px; min-width:0; }
  #text { flex:1; border:0; outline:0; background:transparent; resize:none; padding:9px 6px; max-height:120px; min-height:22px; font:inherit; color:var(--ink); line-height:1.35; }
  .attach { width:38px; height:38px; }
  #fname { font-size:12px; color:var(--acc); padding:0 4px 10px; max-width:30vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fab { width:52px; height:52px; border-radius:50%; border:0; background:var(--acc); color:var(--acc-ink); display:grid; place-items:center; cursor:pointer;
         flex:none; box-shadow:0 4px 14px rgba(11,122,92,.35); transition:transform .15s var(--ease), background .15s; touch-action:none; user-select:none; -webkit-user-select:none; }
  .fab:active { transform:scale(.94); }
  #send { display:none; }
  .has-text #send { display:grid; } .has-text #mic { display:none; }
  /* recording overlay */
  #rec { position:absolute; inset:0; background:var(--surface); display:none; align-items:center; gap:10px; padding:8px 12px calc(8px + env(safe-area-inset-bottom)); }
  #rec.on { display:flex; animation:pop .2s var(--ease) both; }
  #rec .live { width:10px; height:10px; border-radius:50%; background:var(--bad); animation:blink 1s infinite; flex:none; }
  #rec .time { font-variant-numeric:tabular-nums; font-weight:700; min-width:42px; }
  #wave { flex:1; height:36px; min-width:0; }
  #rec .cancel { font-size:12.5px; color:var(--mut); white-space:nowrap; transition:color .15s; }
  #rec.cancelling .cancel { color:var(--bad); font-weight:700; }
  #rec .fab { background:var(--bad); box-shadow:0 0 0 0 rgba(179,38,30,.4); animation:ring 1.4s infinite; }
  @keyframes ring { 0% { box-shadow:0 0 0 0 rgba(179,38,30,.45); } 100% { box-shadow:0 0 0 16px rgba(179,38,30,0); } }

  /* bottom sheet */
  #scrim { position:fixed; inset:0; background:rgba(0,0,0,.35); opacity:0; pointer-events:none; transition:opacity .25s; z-index:5; }
  #sheet { position:fixed; left:0; right:0; bottom:0; max-height:82dvh; background:var(--surface); border-radius:20px 20px 0 0; z-index:6;
           transform:translateY(102%); transition:transform .3s var(--ease); display:flex; flex-direction:column; padding-bottom:env(safe-area-inset-bottom); }
  .sheet-open #scrim { opacity:1; pointer-events:auto; } .sheet-open #sheet { transform:none; }
  #sheet .grab { width:40px; height:5px; border-radius:3px; background:var(--line); margin:8px auto 4px; }
  #sheet h3 { margin:4px 16px 8px; font-size:17px; }
  #sheet .list { overflow-y:auto; padding:0 12px 16px; display:flex; flex-direction:column; gap:10px; }
  .tl { margin:8px 0 0; padding:0 0 0 14px; border-left:2px solid var(--line); font-size:12.5px; color:var(--mut); }
  .tl li { margin:0 0 4px; list-style:none; } .tl b { color:var(--ink); font-weight:600; }
  details summary { cursor:pointer; color:var(--acc); font-size:12.5px; font-weight:600; margin-top:6px; }
  .toast { position:fixed; left:50%; bottom:110px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:8px 14px; border-radius:999px;
           font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:9; }
  .toast.on { opacity:.92; }
  @media (min-width:900px) { #log, #quick { padding-left:max(12px, calc(50vw - 380px)); padding-right:max(12px, calc(50vw - 380px)); }
    footer .composer { max-width:760px; margin:0 auto; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } #log { scroll-behavior:auto; } }
</style>
</head>
<body>
<header>
  <div class="avatar" aria-hidden="true">C</div>
  <div class="who"><b>Chinku</b><div id="status"><span class="dot"></span><span id="statustext">Online</span></div></div>
  <button id="jobchip" aria-label="Show jobs">No job yet</button>
  <button class="iconbtn" id="newchat" aria-label="New chat" title="New chat">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
  </button>
  <button class="iconbtn" id="speak" aria-pressed="false" aria-label="Read replies aloud" title="Read replies aloud">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
  </button>
</header>

<main id="log" aria-live="polite"></main>
<div id="quick"></div>

<footer>
  <form class="composer" id="f" autocomplete="off">
    <div class="field">
      <label class="iconbtn attach" aria-label="Attach photo or PDF" title="Attach photo or PDF">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>
        <input id="file" type="file" accept="image/*,application/pdf" hidden>
      </label>
      <span id="fname"></span>
      <textarea id="text" rows="1" placeholder="Message Chinku…" aria-label="Message"></textarea>
    </div>
    <button class="fab" id="send" type="submit" aria-label="Send">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12 2-12 2z"/></svg>
    </button>
    <button class="fab" id="mic" type="button" aria-label="Hold to talk">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
    </button>
  </form>
  <div id="rec" aria-live="assertive">
    <span class="live"></span><span class="time" id="rectime">0:00</span>
    <canvas id="wave"></canvas>
    <span class="cancel" id="cancelhint">‹ slide to cancel</span>
    <button class="fab" type="button" aria-label="Release to send">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
    </button>
  </div>
</footer>

<div id="scrim"></div>
<section id="sheet" aria-label="Jobs"><div class="grab"></div><h3>Jobs</h3><div class="list" id="joblist"></div></section>
<div class="toast" id="toast"></div>

<script>
(() => {
const key = new URLSearchParams(location.search).get("key") || "";
const $ = id => document.getElementById(id);
const log = $("log");
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hhmm = ts => new Date(ts * 1000).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
const vib = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("on"), 1800); }

/* ---------- status ---------- */
let waiting = false, waitStage = "";
function setStatus(text, busy) { $("statustext").textContent = text; $("status").classList.toggle("busy", !!busy); }
function startWaiting(stage) { waiting = true; waitStage = stage; setStatus(stage, true); showTyping(stage); schedule(700); }
function stopWaiting() { waiting = false; setStatus("Online", false); hideTyping(); }
let typingEl = null;
function showTyping(label) {
  if (!typingEl) { typingEl = document.createElement("div"); typingEl.className = "row bot typing";
    typingEl.innerHTML = `<div class="bubble"><span class="dots"><i></i><i></i><i></i></span><span class="tl"></span></div>`; }
  typingEl.querySelector(".tl").textContent = label; log.appendChild(typingEl); scrollDown();
}
function hideTyping() { if (typingEl && typingEl.parentNode) typingEl.remove(); }

/* ---------- rendering ---------- */
const STATE = { open:["Open","grey"], booked:["Booked","ok"], in_progress:["In progress","warn"], awaiting_approval:["Awaiting approval","warn"],
  invoicing:["Invoicing","warn"], closed:["Closed","ok"], cancelled:["Cancelled","bad"], not_booked:["Not booked","grey"], proposed:["Proposed","warn"],
  pending:["Pending","grey"], tentative:["Tentative","warn"], confirmed:["Confirmed","ok"], failed:["Failed","bad"] };
const chip = k => { const [t, c] = STATE[k] || [k, "grey"]; return `<span class="chip ${c}">${esc(t)}</span>`; };
function jobCard(c, withTimeline) {
  const rows = [["Site", c.site], ["Customer", c.site_contact && [c.site_contact.name, c.site_contact.phone].filter(Boolean).join(" · ")],
                ["Your free time", (c.plumber_windows || []).join(", ")], ["Bill to", c.billing_to], ["Work order", c.work_order]]
    .filter(([, v]) => v).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
  const na = c.next_action ? `<div class="next"><span>➜</span><span><b>Next:</b> ${esc(c.next_action.what)}${c.next_action.blocked_by ? ` <span class="chip grey">Blocked · ${esc(c.next_action.blocked_by)}</span>` : ""}</span></div>` : "";
  const tl = withTimeline && c.timeline && c.timeline.length ? `<details><summary>Timeline (${c.timeline.length})</summary><ul class="tl">${
    c.timeline.slice().reverse().map(e => `<li><b>${esc(hhmm(e.ts))}</b> · ${esc(e.summary)}${e.simulated ? ' <span class="chip grey sim">Simulated</span>' : ""}</li>`).join("")}</ul></details>` : "";
  return `<div class="card"><div class="top"><span class="jid">${esc(c.job_id)}</span><span class="title">${esc(c.issue || "Job")}</span>${chip(c.status)}${chip(c.appointment)}</div><dl class="kv">${rows}</dl>${na}${tl}</div>`;
}
function media(url) {
  if (!url) return "";
  const u = esc(url), low = url.toLowerCase();
  if (/\.(png|jpe?g|webp|gif)$/.test(low)) return `<img src="${u}" alt="" loading="lazy">`;
  if (/\.(mp3|ogg|webm|m4a|wav)$/.test(low)) return `<audio controls preload="none" src="${u}"></audio>`;
  return `<a class="file" href="${u}" target="_blank" rel="noopener">${low.endsWith(".pptx") ? "📊" : "📄"} ${esc(url.split("/").pop())}</a>`;
}
function heardHtml(m) {
  let html = esc(m.text);
  const marks = [...(m.spans || []).map(s => [String(s.raw), "", s.kind]), ...(m.low || []).map(x => [String(x), "low", "unsure"])]
    .filter(([r]) => r && r.trim()).sort((a, b) => b[0].length - a[0].length);
  const seen = new Set();
  for (const [raw, cls, kind] of marks) { const e = esc(raw); if (seen.has(e) || !html.includes(e)) continue; seen.add(e);
    html = html.split(e).join(`<span class="hl ${cls}" data-raw="${esc(raw)}" title="${esc(kind)} — tap to correct">${e}</span>`); }
  const play = m.media_url ? `<a href="${esc(m.media_url)}" target="_blank" rel="noopener">▶ Play</a>` : "";
  return `<span class="lbl">🎙️ Chinku heard ${play}</span>${html}`;
}
function scrollDown() { requestAnimationFrame(() => { log.scrollTop = log.scrollHeight; }); }
const nearBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 140;

function addRow(m) {
  const row = document.createElement("div");
  const mine = m.dir === "in" || m.dir === "heard";
  row.className = "row " + (mine ? "me" : "bot");
  let inner;
  if (m.dir === "heard") inner = `<div class="bubble heard">${heardHtml(m)}<span class="meta">${hhmm(m.ts)}</span></div>`;
  else {
    let body = esc(m.text || "");
    if (m.dir === "out" && m.text && m.text.includes("\n")) { const [first, ...rest] = m.text.split("\n"); body = `<span class="readback">${esc(first)}</span>\n${esc(rest.join("\n"))}`; }
    inner = `<div class="bubble">${body}${media(m.media_url)}${m.card && m.card.type === "job" ? jobCard(m.card) : ""}<span class="meta">${hhmm(m.ts)}</span></div>`;
  }
  row.innerHTML = inner;
  row.querySelectorAll(".hl").forEach(h => h.onclick = () => { const t = $("text"); t.value = `kaadu, ${h.dataset.raw} → `; t.focus(); autosize(); syncButtons(); });
  return row;
}

/* optimistic bubbles: replaced when the server echoes them */
const optimistic = [];
function addOptimistic(text, label, voice) {
  const row = addRow({dir: "in", text: label || text, ts: Date.now() / 1000});
  row.classList.add("pending"); hideWelcome(); log.appendChild(row); if (typingEl && typingEl.parentNode) log.appendChild(typingEl); scrollDown();
  optimistic.push({text, row, voice: !!voice, t: Date.now()});
}
function consumeOptimistic(m) {
  const i = optimistic.findIndex(o => (m.dir === "heard" && o.voice) || (m.dir === "in" && !o.voice && (o.text || "") .trim() === (m.text || "").trim()));
  if (i >= 0) { const o = optimistic.splice(i, 1)[0]; const row = addRow(m); o.row.replaceWith(row); return true; }
  return false;
}

/* ---------- welcome ---------- */
const EXAMPLES = [
  ["New job", "Chinku, new job. Customer 99896 83607, kitchen tap leaking at Flat 304, Green Park. I'm free tomorrow 11 to 1 or after 4. Bill Sai Facility under WO-117."],
  ["Status", "What's pending today?"],
  ["Correction", "kaadu, Flat 310"]];
function showWelcome() {
  if (log.children.length) return;
  const w = document.createElement("div"); w.className = "welcome"; w.id = "welcome";
  w.innerHTML = `<div class="avatar big">C</div><h2>Hi, I'm Chinku</h2><p>Your office assistant. Hold the mic and talk — Telugu, English or both.</p>
    <div class="examples">${EXAMPLES.map(([t, s]) => `<button data-s="${esc(s)}">${esc(t)}<span>${esc(s)}</span></button>`).join("")}</div>`;
  w.querySelectorAll("button").forEach(b => b.onclick = () => send(b.dataset.s));
  log.appendChild(w);
}
const hideWelcome = () => { const w = $("welcome"); if (w) w.remove(); };

/* ---------- quick replies ---------- */
function setQuick(text) {
  const q = $("quick"); q.innerHTML = "";
  const t = (text || "").trim();
  const opts = [];
  if (/\?\s*(\(yes \/ no\))?\s*$/i.test(t) && /(shall i|should i|go ahead|did i get that right|call|send|book)/i.test(t)) opts.push(["Yes", true], ["No"], ["Change"]);
  opts.push(["Jobs"]);
  opts.forEach(([label, primary]) => { const b = document.createElement("button"); b.textContent = label; if (primary) b.className = "primary";
    b.onclick = () => label === "Jobs" ? openSheet() : label === "Change" ? ($("text").focus()) : send(label); q.appendChild(b); });
}

/* ---------- polling ---------- */
let since = 0, timer = null, firstLoad = true;
function schedule(ms) { clearTimeout(timer); timer = setTimeout(poll, ms); }
async function poll() {
  try {
    const r = await fetch(`/api/chat/messages?key=${encodeURIComponent(key)}&since=${since}`, {cache: "no-store"});
    if (r.status === 403) { setStatus("Wrong or missing key", false); return; }
    if (r.ok) {
      const rows = await r.json();
      const stick = nearBottom() || firstLoad;
      let lastOut = null, gotHeard = false;
      for (const m of rows) {
        since = Math.max(since, m.ts);
        if (!firstLoad && consumeOptimistic(m)) { if (m.dir === "heard") gotHeard = true; continue; }
        hideWelcome(); log.appendChild(addRow(m));
        if (m.dir === "out") lastOut = m; if (m.dir === "heard") gotHeard = true;
      }
      if (gotHeard && waiting) { waitStage = "Understanding…"; setStatus(waitStage, true); showTyping(waitStage); }
      if (lastOut) { stopWaiting(); setQuick(lastOut.text); if (!firstLoad) speak(lastOut.text); if (!firstLoad) vib(15); refreshJobs(); }
      else if (typingEl && typingEl.parentNode) log.appendChild(typingEl);
      if (rows.length && stick) scrollDown();
      if (firstLoad) { firstLoad = false; if (!rows.length) showWelcome(); refreshJobs(); }
    }
  } catch (e) { setStatus("Reconnecting…", true); }
  schedule(waiting ? 800 : 2500);
}

/* ---------- jobs sheet ---------- */
let jobs = [];
async function refreshJobs() {
  try { const r = await fetch(`/api/jobs?key=${encodeURIComponent(key)}`, {cache: "no-store"}); if (!r.ok) return; jobs = await r.json();
    const open = jobs.filter(j => !["closed", "cancelled"].includes(j.status));
    $("jobchip").textContent = open.length ? `${open[0].job_id} · ${open[0].issue || open[0].site || ""}${open.length > 1 ? ` +${open.length - 1}` : ""}` : "No job yet";
  } catch (e) {}
}
function openSheet() {
  $("joblist").innerHTML = jobs.length ? jobs.map(j => jobCard(j, true)).join("") : `<p style="color:var(--mut);margin:0 4px">No jobs yet. Describe a new job to start.</p>`;
  document.body.classList.add("sheet-open");
}
const closeSheet = () => document.body.classList.remove("sheet-open");
$("jobchip").onclick = openSheet; $("scrim").onclick = closeSheet;
let sy = null; $("sheet").addEventListener("touchstart", e => sy = e.touches[0].clientY, {passive: true});
$("sheet").addEventListener("touchend", e => { if (sy !== null && e.changedTouches[0].clientY - sy > 70 && $("joblist").scrollTop <= 0) closeSheet(); sy = null; });

/* ---------- speak replies ---------- */
let speaking = store.get("chinku_speak") === "1";
$("speak").setAttribute("aria-pressed", speaking);
$("speak").onclick = () => { speaking = !speaking; store.set("chinku_speak", speaking ? "1" : "0"); $("speak").setAttribute("aria-pressed", speaking);
  toast(speaking ? "Replies will be read aloud" : "Read-aloud off"); if (!speaking) try { speechSynthesis.cancel(); } catch (e) {} };
function speak(t) { if (!speaking || !t || !("speechSynthesis" in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t.split("\n")[0].slice(0, 240)); u.lang = "en-IN"; u.rate = 1.02; speechSynthesis.speak(u); } catch (e) {} }

/* ---------- sending ---------- */
async function send(text, file, voiceSecs) {
  text = (text || "").trim();
  if (!text && !file) return;
  $("quick").innerHTML = "";
  if (file && voiceSecs !== undefined) { addOptimistic("", `🎙️ Voice note · ${fmt(voiceSecs)}`, true); startWaiting("Listening…"); }
  else if (file && !text) { addOptimistic(`(file: ${file.name})`, `📎 ${file.name}`); startWaiting("Reading the file…"); }
  else { addOptimistic(text, file ? `${text}
📎 ${file.name}` : ""); startWaiting(file ? "Reading the file…" : "Thinking…"); }
  const fd = new FormData(); fd.append("key", key); fd.append("text", text);
  if (file) fd.append("file", file, file.name || "voice.webm");
  try {
    const r = await fetch(voiceSecs !== undefined ? "/api/voice" : "/api/chat", {method: "POST", body: fd});
    if (!r.ok) { const j = await r.json().catch(() => ({})); stopWaiting(); toast(j.error || "Couldn't send — try again"); }
  } catch (e) { stopWaiting(); toast("No connection — try again"); }
  optimistic.forEach(o => o.row.classList.remove("pending"));
}
const textEl = $("text");
function autosize() { textEl.style.height = "auto"; textEl.style.height = Math.min(textEl.scrollHeight, 120) + "px"; }
function syncButtons() { $("f").classList.toggle("has-text", !!(textEl.value.trim() || $("file").files[0])); }
textEl.addEventListener("input", () => { autosize(); syncButtons(); });
textEl.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("f").requestSubmit(); } });
$("file").onchange = () => { const f = $("file").files[0]; $("fname").textContent = f ? f.name : ""; syncButtons(); };
$("f").onsubmit = e => { e.preventDefault(); const t = textEl.value, f = $("file").files[0]; textEl.value = ""; $("file").value = ""; $("fname").textContent = "";
  autosize(); syncButtons(); send(t, f); };

/* ---------- hold-to-talk with waveform + slide to cancel ---------- */
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
let rec = null, chunks = [], stream = null, actx = null, raf = null, t0 = 0, startX = 0, cancelled = false, tick = null, maxT = null;
async function startRec(e) {
  e.preventDefault(); startX = e.clientX; cancelled = false;
  if (!navigator.mediaDevices || !window.MediaRecorder) { toast("Voice not supported in this browser"); return; }
  try { stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true}}); }
  catch (err) { toast("Allow microphone to talk to Chinku"); return; }
  const mime = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"].find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || "";
  rec = new MediaRecorder(stream, mime ? {mimeType: mime} : undefined); chunks = [];
  rec.ondataavailable = ev => ev.data.size && chunks.push(ev.data);
  rec.onstop = onStop; rec.start(250); t0 = Date.now(); vib(20);
  $("rec").classList.add("on"); $("rec").classList.remove("cancelling");
  tick = setInterval(() => $("rectime").textContent = fmt((Date.now() - t0) / 1000), 200);
  maxT = setTimeout(() => stopRec(), 90000);
  drawWave();
}
function drawWave() {
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const an = actx.createAnalyser(); an.fftSize = 256; actx.createMediaStreamSource(stream).connect(an);
    const cv = $("wave"), g = cv.getContext("2d"), data = new Uint8Array(an.frequencyBinCount), bars = [];
    const col = getComputedStyle(document.documentElement).getPropertyValue("--bad").trim() || "#b3261e";
    const loop = () => {
      const w = cv.clientWidth, h = cv.clientHeight, dpr = window.devicePixelRatio || 1;
      if (cv.width !== w * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
      an.getByteTimeDomainData(data); let peak = 0; for (const v of data) peak = Math.max(peak, Math.abs(v - 128));
      bars.push(Math.min(1, peak / 64)); const n = Math.floor(w / 5); while (bars.length > n) bars.shift();
      g.clearRect(0, 0, cv.width, cv.height); g.fillStyle = col;
      bars.forEach((b, i) => { const bh = Math.max(2, b * h) * dpr; g.fillRect((i * 5) * dpr, (h * dpr - bh) / 2, 3 * dpr, bh); });
      raf = requestAnimationFrame(loop);
    }; loop();
  } catch (e) {}
}
function moveRec(e) { if (!rec || rec.state !== "recording") return; cancelled = e.clientX - startX < -80; $("rec").classList.toggle("cancelling", cancelled);
  $("cancelhint").textContent = cancelled ? "Release to cancel" : "‹ slide to cancel"; }
function stopRec(e) { if (e) e.preventDefault(); if (rec && rec.state === "recording") rec.stop(); }
function onStop() {
  clearInterval(tick); clearTimeout(maxT); cancelAnimationFrame(raf); try { actx && actx.close(); } catch (e) {}
  stream && stream.getTracks().forEach(t => t.stop()); $("rec").classList.remove("on"); $("rectime").textContent = "0:00"; $("cancelhint").textContent = "‹ slide to cancel";
  const secs = (Date.now() - t0) / 1000; vib(cancelled ? [10, 40, 10] : 15);
  if (cancelled) { toast("Cancelled"); return; }
  if (secs < 0.7) { toast("Hold the mic and speak"); return; }
  const type = rec.mimeType || "audio/webm"; const ext = type.includes("mp4") ? "m4a" : "webm";
  send("", new File([new Blob(chunks, {type})], `voice.${ext}`, {type}), secs);
}
const mic = $("mic");
mic.addEventListener("pointerdown", e => { mic.setPointerCapture && mic.setPointerCapture(e.pointerId); startRec(e); });
mic.addEventListener("pointermove", moveRec);
mic.addEventListener("pointerup", stopRec); mic.addEventListener("pointercancel", e => { cancelled = true; stopRec(e); });
mic.addEventListener("contextmenu", e => e.preventDefault());

/* ---------- new chat ---------- */
$("newchat").onclick = async () => {
  if (!confirm("Start a new chat? Your jobs and history stay saved.")) return;
  const fd = new FormData(); fd.append("key", key);
  try { await fetch("/api/chat/clear", {method: "POST", body: fd}); } catch (e) {}
  log.innerHTML = ""; $("quick").innerHTML = ""; since = Date.now() / 1000; showWelcome(); toast("New chat");
};

/* ---------- start ---------- */
if (!key) setStatus("Missing key in the link", false);
syncButtons(); poll();
document.addEventListener("visibilitychange", () => { if (!document.hidden) schedule(50); });
})();
</script>
</body>
</html>
