name: doc_total_email
description: "User sent a PDF / bill / invoice / quotation; wants the total worked out and sent to someone by email"
route_examples:
  - "Instint, ee PDF analyze chesi total cheppu, aa total Suresh ki mail pettu"
  - "analyze the pdf, give me the total and send it to suresh by email"
inputs:
  document:        {source: media, media: document, required: true}
  recipient_name:  {source: text}
  recipient_email: {source: text_or_contacts, required: true, validate: email}
  purpose:         {source: text}
confirm_before: []
steps:
  - id: total
    type: compute
    list: "inputs.document.line_items"
    field: amount
    op: sum
    check_against: "inputs.document.stated_total"
  - id: tell_total
    type: reply
    template_hint: "Tell Hanish the document total (from step 'total': total, count of items, and whether it matches the printed total; if it does not match, say so clearly). Say the email to {inputs.recipient_name} is ready for his OK."
  - id: send_mail
    type: email
    to: "{inputs.recipient_email}"
    goal: "Send {inputs.recipient_name} the total of '{inputs.document.title}' ({inputs.document.doc_type}): ₹{steps.total.output.total_str}, with a short item-wise breakdown from task_inputs.document.line_items. Purpose: {inputs.purpose}"
    shareable: [user_name]
  - id: report
    type: reply
    template_hint: "One or two lines: email with the total sent to {inputs.recipient_name} (address; demo mode = delivered to Hanish's own inbox)."
result_schema: {}
