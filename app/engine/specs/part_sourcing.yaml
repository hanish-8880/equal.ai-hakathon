name: part_sourcing
description: "Plumber job: call the plumber's chosen shops about one part (exact model, stock today, price, MRP, GST, delivery, condition, pickup, hold) — started from a job"
route_examples: []
internal: true
inputs:
  job_id:       {source: job, required: true}
  part_id:      {source: job, required: true}
  part_desc:    {source: job, required: true}
  qty:          {source: job, required: true, type: number}
  shops:        {source: job, required: true, type: list, item_fields: [name, phone], validate_item: {phone: indian_mobile}}
  plumber_name: {source: job}
confirm_before: []
steps:
  - id: ask_shops
    type: call
    call_kind: shop_part_check
    for_each: shops
    to: "{item.phone}"
    callee: {name: "{item.name}", role: "plumbing / hardware shop"}
    goal: "Ask about {inputs.qty} x {inputs.part_desc} for plumber {inputs.plumber_name}: exact model in stock today, units, selling price per piece, MRP, GST, delivery charge, any price condition, pickup address and earliest time, and whether they can hold it."
    must_collect: [exact_model_available, model_offered, exact_model_eta, units_available, unit_price, mrp, gst_included, delivery_charge, price_condition, pickup_address, earliest_pickup, hold_offered, hold_until]
    language: English
    max_minutes: 3
    retry_on_no_answer: 1
  - id: record
    type: job_op
    op: record_offers
    from_step: ask_shops
  - id: compare
    type: job_op
    op: compare_offers
result_schema:
  exact_model_available: {type: boolean, note: "true only if they have the EXACT model and size asked"}
  model_offered:         {type: string, note: "the model code they actually have, exactly as said"}
  exact_model_eta:       {type: string, note: "when the exact model will be available if not now, e.g. tomorrow"}
  units_available:       {type: number}
  unit_price:            {type: number, unit: INR, note: "actual selling price per piece, not MRP"}
  mrp:                   {type: number, unit: INR}
  gst_included:          {type: boolean}
  delivery_charge:       {type: number, unit: INR}
  price_condition:       {type: string, note: "e.g. 'Rs 300 only if 10 or more'"}
  pickup_address:        {type: string}
  earliest_pickup:       {type: string}
  hold_offered:          {type: boolean}
  hold_until:            {type: string}
